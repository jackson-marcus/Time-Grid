services:
  api:
    build: .
    env_file: .env
    ports:
      - "8450:8000"
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      TIMEGRID_API_URL: http://api:8000
    ports:
      - "8951:8501"
    depends_on:
      - api
